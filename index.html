<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OPEN CITY</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="start">
      <h1>OPEN CITY</h1>
      <p>
        Free-roam open world. Drive, walk, and steal any car. Watch out for cops
        — the more chaos you cause, the hotter it gets.
      </p>
      <button id="go">ENTER THE CITY</button>
    </div>
    <div class="hud" id="stats">
      <div class="row"><span id="mode">ON FOOT</span></div>
      <div class="row">
        <span>HP</span>
        <div id="hpbar"><div id="hpf"></div></div>
      </div>
      <div class="row"><span>WANTED</span><span id="wanted">–</span></div>
    </div>
    <div class="hud" id="mini">
      <canvas id="mm" width="160" height="160"></canvas>
    </div>
    <div class="hud" id="spd">
      <b id="kmh">0</b> <small>km/h</small><br /><span id="gear">N</span>
      <div id="rpm"><div id="rpmf"></div></div>
    </div>
    <div class="hud" id="msg"></div>
    <div class="hud" id="help">
      W/↑ forward · S/↓ back · A D/←→ steer · SPACE handbrake · F enter/exit car
      · C camera · R reset
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
