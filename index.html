<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OPEN CITY</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />
    <link rel="manifest" href="assets/icons/site.webmanifest" />
    <meta name="theme-color" content="#0b0d12" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="start">
      <h1>OPEN CITY</h1>
      <p>
        Free-roam open world. Drive, walk, and steal any car. Watch out for cops
        — the more chaos you cause, the hotter it gets.
      </p>
      <button id="go">ENTER THE CITY</button>
    </div>
    <div class="hud" id="stats">
      <div class="row"><span id="mode">ON FOOT</span></div>
      <div class="row">
        <span>HP</span>
        <div id="hpbar"><div id="hpf"></div></div>
      </div>
      <div class="row"><span>WANTED</span><span id="wanted">–</span></div>
    </div>
    <div class="hud" id="mini">
      <canvas id="mm" width="160" height="160"></canvas>
    </div>
    <div class="hud" id="spd">
      <b id="kmh">0</b> <small>km/h</small><br /><span id="gear">N</span>
      <div id="rpm"><div id="rpmf"></div></div>
    </div>
    <div class="hud" id="msg"></div>
    <div class="hud" id="help">
      W/↑ forward · S/↓ back · A D/←→ steer · SPACE handbrake · F enter/exit car
      · C camera · R reset
    </div>
    <div id="touch">
      <div id="stick"><div id="nub"></div></div>
      <div id="tbtns">
        <button class="tbtn" data-key="f">F</button>
        <button class="tbtn" data-key="c">C</button>
        <button class="tbtn" data-key="r">R</button>
        <button class="tbtn hb" data-key=" ">HANDBRAKE</button>
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/touch.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
